[package]
name = "termic-proto"
version = "0.1.0"
description = "Wire types for the termic CLI <-> app control socket (NDJSON framing, protocol version, exit codes)."
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
workspace = "../src-tauri"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows control-socket transport (src/transport.rs): named-pipe FFI.
# Target-gated so Unix builds never compile it. 0.60.2 is already in the
# dependency tree via tauri, so pinning it here direct changes nothing in
# resolution.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
