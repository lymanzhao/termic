[package]
name = "axcoding"
version = "0.1.0"
edition = "2021"
description = "Standalone research crate: axcoding-agent (a pi-style minimal rig agent) and axcoding-rlm (a self-improving RLM harness)"

[dependencies]
rhai = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }

[[bin]]
name = "axcoding-agent"
path = "src/bin/axcoding_agent.rs"

[[bin]]
name = "axcoding-rlm"
path = "src/bin/axcoding_rlm.rs"

[profile.dev]
opt-level = 1
