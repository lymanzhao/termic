[package]
name = "axcoding"
version = "0.1.0"
edition = "2021"
description = "Standalone research crate: axcoding-agent, a pi-style minimal coding agent on rig-core"

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rig-core = { version = "0.42", default-features = false, features = ["reqwest", "rustls"] }
ratatui = { version = "0.30", features = ["scrolling-regions"] }
crossterm = "0.29"
unicode-width = "0.2"

[[bin]]
name = "axcoding-agent"
path = "src/bin/axcoding_agent.rs"

[profile.dev]
opt-level = 1
